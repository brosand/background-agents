apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open-inspect.fullname" . }}-web
  labels:
    {{- include "open-inspect.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "open-inspect.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "open-inspect.web.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: CONTROL_PLANE_URL
              value: "http://{{ include "open-inspect.fullname" . }}-control-plane:{{ .Values.controlPlane.port }}"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://{{ .Values.ingress.controlPlane.host }}"
            - name: NEXTAUTH_URL
              value: "https://{{ .Values.ingress.web.host }}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.web }}
                  key: nextauth-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.web }}
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.web }}
                  key: github-client-secret
            - name: INTERNAL_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.web }}
                  key: internal-callback-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-inspect.fullname" . }}-web
  labels:
    {{- include "open-inspect.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "open-inspect.web.selectorLabels" . | nindent 4 }}
