{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "open-inspect.fullname" . }}
  labels:
    {{- include "open-inspect.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if or .Values.ingress.controlPlane.tls .Values.ingress.web.tls }}
  tls:
    {{- if .Values.ingress.controlPlane.tls }}
    - hosts:
        - {{ .Values.ingress.controlPlane.host }}
      secretName: {{ .Values.ingress.controlPlane.tlsSecretName }}
    {{- end }}
    {{- if .Values.ingress.web.tls }}
    - hosts:
        - {{ .Values.ingress.web.host }}
      secretName: {{ .Values.ingress.web.tlsSecretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.controlPlane.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "open-inspect.fullname" . }}-control-plane
                port:
                  number: {{ .Values.controlPlane.port }}
    - host: {{ .Values.ingress.web.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "open-inspect.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
