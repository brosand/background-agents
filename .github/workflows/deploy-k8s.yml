name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: control-plane
            context: .
            dockerfile: packages/control-plane/Dockerfile
          - name: sandbox-api
            context: packages/sandbox-api
            dockerfile: packages/sandbox-api/Dockerfile
          - name: sandbox
            context: packages/sandbox-image
            dockerfile: packages/sandbox-image/Dockerfile
          - name: web
            context: .
            dockerfile: packages/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Update image tags
        run: |
          cd k8s
          # Update image references to point to the new SHA
          for component in control-plane sandbox-api web; do
            find . -name "*.yaml" -exec sed -i "s|open-inspect-${component}:latest|${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${component}:${{ github.sha }}|g" {} +
          done
          # Update sandbox image reference
          find . -name "*.yaml" -exec sed -i "s|open-inspect-sandbox:latest|${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-sandbox:${{ github.sha }}|g" {} +

      - name: Deploy
        run: kubectl apply -k k8s/

      - name: Wait for rollout
        run: |
          kubectl -n open-inspect rollout status deployment/control-plane --timeout=180s
          kubectl -n open-inspect rollout status deployment/sandbox-api --timeout=120s
          kubectl -n open-inspect rollout status deployment/web --timeout=120s

      - name: Verify health
        run: |
          # Port-forward and check health
          kubectl -n open-inspect port-forward svc/control-plane 8787:8787 &
          sleep 5
          curl -sf http://localhost:8787/health || exit 1
          echo "Health check passed!"
