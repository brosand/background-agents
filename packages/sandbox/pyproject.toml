[project]
name = "open-inspect-sandbox"
version = "0.1.0"
description = "Open-Inspect sandbox runtime (K8s/Rivet)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic>=2.0",
    "PyJWT[crypto]>=2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
