# Secret template — fill in values before applying.
# In production, use external-secrets-operator, sealed-secrets, or Vault.
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-secrets
  namespace: open-inspect
type: Opaque
stringData:
  database-url: "postgresql://open_inspect:CHANGE_ME@postgres:5432/open_inspect"
  redis-url: "redis://redis:6379"
  postgres-password: "CHANGE_ME"
  token-encryption-key: ""                   # Generate: openssl rand -base64 32
  repo-secrets-encryption-key: ""            # Generate: openssl rand -base64 32
  modal-api-secret: ""                       # Generate: openssl rand -hex 32
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app-secrets
  namespace: open-inspect
type: Opaque
stringData:
  app-id: ""
  private-key: ""                            # PEM-encoded private key
  installation-id: ""
