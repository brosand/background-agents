apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: open-inspect
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: open-inspect
spec:
  replicas: 1   # Single replica — SessionActorRegistry is in-process
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/part-of: open-inspect
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: control-plane
          image: open-inspect/control-plane-k8s:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: control-plane-secrets
                  key: redis-url
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-secrets
                  key: token-encryption-key
            - name: REPO_SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-secrets
                  key: repo-secrets-encryption-key
                  optional: true
            - name: MODAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: control-plane-secrets
                  key: modal-api-secret
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-secrets
                  key: app-id
                  optional: true
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app-secrets
                  key: private-key
                  optional: true
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-secrets
                  key: installation-id
                  optional: true
            - name: DEPLOYMENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
