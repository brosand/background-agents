apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: open-inspect
  labels:
    app: open-inspect
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: open-inspect
      component: web
  template:
    metadata:
      labels:
        app: open-inspect
        component: web
    spec:
      containers:
        - name: web
          image: open-inspect-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: CONTROL_PLANE_URL
              value: "http://control-plane:8787"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.open-inspect.example.com"  # Change to your domain
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.open-inspect.example.com"
            - name: NEXTAUTH_URL
              value: "https://open-inspect.example.com"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: TOKEN_ENCRYPTION_KEY
          envFrom:
            - secretRef:
                name: api-secrets
            - secretRef:
                name: github-app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/auth/session
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/auth/session
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: open-inspect
spec:
  selector:
    app: open-inspect
    component: web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: open-inspect
spec:
  rules:
    - host: open-inspect.example.com  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
