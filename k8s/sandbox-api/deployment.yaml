apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-api
  namespace: open-inspect
---
# The sandbox-api needs permissions to manage pods and PVCs in the sandboxes namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-manager
  namespace: open-inspect-sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-api-binding
  namespace: open-inspect-sandboxes
subjects:
  - kind: ServiceAccount
    name: sandbox-api
    namespace: open-inspect
roleRef:
  kind: Role
  name: sandbox-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
  namespace: open-inspect
  labels:
    app: open-inspect
    component: sandbox-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-inspect
      component: sandbox-api
  template:
    metadata:
      labels:
        app: open-inspect
        component: sandbox-api
    spec:
      serviceAccountName: sandbox-api
      containers:
        - name: sandbox-api
          image: open-inspect-sandbox-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: SANDBOX_NAMESPACE
              value: open-inspect-sandboxes
            - name: SANDBOX_IMAGE
              value: open-inspect-sandbox:latest
            - name: SANDBOX_CPU_REQUEST
              value: "500m"
            - name: SANDBOX_CPU_LIMIT
              value: "2000m"
            - name: SANDBOX_MEMORY_REQUEST
              value: "512Mi"
            - name: SANDBOX_MEMORY_LIMIT
              value: "4Gi"
            - name: SANDBOX_STORAGE_SIZE
              value: "10Gi"
            - name: LLM_SECRETS_NAME
              value: llm-api-keys
            - name: LOG_LEVEL
              value: INFO
          envFrom:
            - secretRef:
                name: api-secrets
            - secretRef:
                name: github-app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-api
  namespace: open-inspect
spec:
  selector:
    app: open-inspect
    component: sandbox-api
  ports:
    - port: 8080
      targetPort: 8080
