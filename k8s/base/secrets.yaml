# Secret templates - populate values before applying.
# In production, use sealed-secrets, external-secrets, or Vault.
#
# Generate secrets:
#   API_SECRET:               openssl rand -hex 32
#   TOKEN_ENCRYPTION_KEY:     openssl rand -hex 32
#   REPO_SECRETS_KEY:         openssl rand -hex 32
#   Postgres password:        openssl rand -base64 24

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: open-inspect
type: Opaque
stringData:
  username: postgres
  password: "CHANGE_ME"  # openssl rand -base64 24
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: open-inspect
type: Opaque
stringData:
  API_SECRET: "CHANGE_ME"                    # openssl rand -hex 32
  TOKEN_ENCRYPTION_KEY: "CHANGE_ME"          # openssl rand -hex 32
  REPO_SECRETS_ENCRYPTION_KEY: "CHANGE_ME"   # openssl rand -hex 32
---
apiVersion: v1
kind: Secret
metadata:
  name: github-app
  namespace: open-inspect
type: Opaque
stringData:
  GITHUB_APP_ID: ""
  GITHUB_APP_PRIVATE_KEY: ""
  GITHUB_APP_INSTALLATION_ID: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-keys
  namespace: open-inspect
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
---
# Also create the llm-api-keys secret in the sandboxes namespace
# so sandbox pods can access LLM provider keys
apiVersion: v1
kind: Secret
metadata:
  name: llm-api-keys
  namespace: open-inspect-sandboxes
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
